<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>KitFix247 Admin — Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&amp;family=Chakra+Petch:ital,wght@0,600;0,700;1,700&amp;display=swap">
<style>
body{margin:0}
.kf-side:hover{background:rgba(244,241,236,0.08)}
.kf-side:focus-visible{outline:2px solid #f57a0a;outline-offset:-2px}
@container (max-width: 820px){
.kf-sb{min-height:0 !important;padding:12px 16px !important;gap:12px !important}
.kf-sb-groups{flex-direction:row !important;overflow-x:auto;gap:4px !important;padding-bottom:4px}
.kf-sb-g{flex-direction:row !important;flex:none}
.kf-sb-gt{display:none !important}
.kf-sb-site{display:none !important}
.kf-sb-item{white-space:nowrap}
}
</style>
</helmet>
<nav class="kf-sb" aria-label="Menu quản trị" style="width: 100%; min-height: 900px; box-sizing: border-box; background: #0e2843; color: #f4f1ec; font-family: 'Be Vietnam Pro','Segoe UI',system-ui,sans-serif; font-size: 14px; line-height: 20px; padding: 20px 12px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<span style="background: #f4f1ec; border-radius: 8px; padding: 6px 10px; display: inline-flex"><img src="/_blob/e386016b6beeebde9254aabaf6551ca6" alt="KitFix247" style="height: 36px; width: auto; display: block"></span>
<span style="font-size: 13px; color: #aebbd0; font-weight: 600">Quản trị</span>
</div>
<div class="kf-sb-groups" style="display: flex; flex-direction: column; gap: 20px; min-width: 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div class="kf-sb-g" style="display: flex; flex-direction: column; gap: 2px">
<div class="kf-sb-gt" style="padding: 0 12px 6px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #aebbd0">{{g.title}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a class="kf-side kf-sb-item" href="{{it.href}}" aria-current="{{it.cur}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: {{it.fg}}; background: {{it.bg}}; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{it.icon}}"></path></svg>
<span style="flex-grow: 1">{{it.name}}</span>
<sc-if value="{{it.badge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 20px; border-radius: 999px; background: #f57a0a; color: #0e2843; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box">{{it.badge}}</span></sc-if>
</a>
</sc-for>
</div>
</sc-for>
</div>
<a class="kf-side kf-sb-site" href="Main.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #aebbd0; font-weight: 600; border: 1px solid #22446a">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path></svg>Xem website</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["tongquan","lichhen","donhang","dichvu","banggia","sanpham","baiviet","thuonghieu","danhgia","trangchu","menu","lienhe","footer","baohanh"],"default":"tongquan"},"$preview":{"width":260,"height":900}}'>
var I = {
  grid: 'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z',
  cal: 'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4',
  bag: 'M5 8h14l-1 13H6z M9 8V6a3 3 0 0 1 6 0v2',
  wrench: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z',
  tag: 'M3 12V4h8l9 9-8 8z M7.5 7.5h.01',
  box: 'M3 7l9-4 9 4-9 4z M3 7v10l9 4 9-4V7 M12 11v10',
  doc: 'M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6',
  star: 'M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z',
  home: 'M3 11l9-8 9 8 M5 9.5V21h14V9.5',
  menu: 'M4 6h16 M4 12h16 M4 18h10',
  phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2',
  card: 'M3 6h18v12H3z M3 10h18 M7 15h4',
  shield: 'M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z M8.5 12l2.5 2.5 4.5-5'
};
class Component extends DCLogic {
  renderVals() {
    var a = this.props.active ?? 'tongquan';
    var G = [
      { title: 'Vận hành', items: [
        { k: 'tongquan', name: 'Tổng quan', icon: I.grid, href: 'AdminTongQuan.dc.html' },
        { k: 'lichhen', name: 'Lịch hẹn', icon: I.cal, href: 'AdminTongQuan.dc.html', badge: '5' },
        { k: 'donhang', name: 'Đơn hàng', icon: I.bag, href: 'AdminTongQuan.dc.html', badge: '2' } ] },
      { title: 'Nội dung', items: [
        { k: 'dichvu', name: 'Dịch vụ', icon: I.wrench, href: 'AdminDichVu.dc.html' },
        { k: 'banggia', name: 'Bảng giá', icon: I.tag, href: 'AdminDichVu.dc.html' },
        { k: 'sanpham', name: 'Sản phẩm (Shop)', icon: I.box, href: '#' },
        { k: 'baiviet', name: 'Bài viết & SEO', icon: I.doc, href: 'AdminBaiViet.dc.html' },
        { k: 'thuonghieu', name: 'Thương hiệu', icon: I.tag, href: 'AdminThuongHieu.dc.html' },
        { k: 'danhgia', name: 'Đánh giá khách hàng', icon: I.star, href: '#' },
        { k: 'trangchu', name: 'Trang chủ & Hero', icon: I.home, href: '#' } ] },
      { title: 'Cài đặt', items: [
        { k: 'menu', name: 'Menu điều hướng', icon: I.menu, href: '#' },
        { k: 'lienhe', name: 'Hotline, Zalo, CTA', icon: I.phone, href: '#' },
        { k: 'footer', name: 'Footer & thanh toán', icon: I.card, href: '#' },
        { k: 'baohanh', name: 'Chính sách bảo hành', icon: I.shield, href: '#' } ] }
    ];
    return {
      groups: G.map(function (g) {
        return { title: g.title, items: g.items.map(function (it) {
          var on = it.k === a;
          return Object.assign({}, it, { badge: it.badge || '', cur: on ? 'page' : 'false', bg: on ? '#f57a0a' : 'transparent', fg: on ? '#0e2843' : '#f4f1ec' });
        }) };
      })
    };
  }
}
</script>
</body>
</html>
