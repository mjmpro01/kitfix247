<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>KitFix247 — Bong bóng liên hệ</title>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
.kf-bub{position:relative}
.kf-bub .kf-tip{opacity:0;transform:translateX(6px);transition:opacity .15s,transform .15s;pointer-events:none}
.kf-bub:hover .kf-tip,.kf-bub:focus-visible .kf-tip{opacity:1;transform:none}
.kf-bub:hover .kf-circle{transform:scale(1.06)}
.kf-bub:focus-visible{outline:none}
.kf-bub:focus-visible .kf-circle{outline:2px solid #b85200;outline-offset:3px}
.kf-circle{transition:transform .15s}
@keyframes kfPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.kf-pulse{animation:kfPulse 1.8s ease-out infinite}
@media (prefers-reduced-motion: reduce){.kf-pulse{animation:none;opacity:0}}
</style>
</helmet>
<nav aria-label="Liên hệ nhanh" style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px; font-family: 'Be Vietnam Pro','Segoe UI',system-ui,sans-serif">

<a class="kf-bub" href="{{bookHref}}" aria-label="Đặt lịch sửa" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<span class="kf-tip" style="background: #0e2843; color: #f4f1ec; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; box-shadow: 0 4px 14px rgba(14,40,67,0.25)">Đặt lịch sửa</span>
<span class="kf-circle" style="width: 52px; height: 52px; border-radius: 999px; background: #ffffff; color: #0e2843; border: 1.5px solid #ddd6cc; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(14,40,67,0.22)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4"></path></svg></span>
</a>

<a class="kf-bub" href="https://zalo.me/0989041641" aria-label="Nhắn Zalo 0989.041.641" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<span class="kf-tip" style="background: #0e2843; color: #f4f1ec; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; box-shadow: 0 4px 14px rgba(14,40,67,0.25)">Nhắn Zalo</span>
<span class="kf-circle" style="width: 56px; height: 56px; border-radius: 999px; background: #0e2843; color: #f4f1ec; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 4px 14px rgba(14,40,67,0.3)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
<span style="font-size: 10px; line-height: 12px; font-weight: 800">Zalo</span></span>
</a>

<a class="kf-bub" href="tel:0989041641" aria-label="Gọi 0989.041.641" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<span class="kf-tip" style="background: #f57a0a; color: #0e2843; font-size: 14px; font-weight: 800; padding: 6px 12px; border-radius: 999px; white-space: nowrap; box-shadow: 0 4px 14px rgba(14,40,67,0.25)">Gọi 0989.041.641</span>
<span style="position: relative; width: 64px; height: 64px; display: flex; flex: none">
<span class="kf-pulse" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 999px; background: #f57a0a"></span>
<span class="kf-circle" style="position: relative; width: 64px; height: 64px; border-radius: 999px; background: #f57a0a; color: #0e2843; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(245,122,10,0.45)">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></span>
</span>

</nav>
</x-dc>
